<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ARダーツ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: full-screen canvas game. Camera feed (or a room backdrop) behind a canvas; HUD pinned to the safe areas; overlays as centred sheets. */
:root{
  --bg:#14110f; --ink:#f4eee0; --mute:#a99f8d; --cream:#eadfc4; --red:#e2433a; --green:#1f8a4c; --gold:#ffc83d;
  --panel:rgba(20,17,15,.86);
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--body);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#c{position:fixed;inset:0;display:block}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#hud small{display:block;font-size:11px;letter-spacing:.14em;color:var(--cream);opacity:.85}
#hud b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
#hud .r{text-align:right}
#pips{display:flex;gap:7px;padding-top:12px}
#pips i{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.5)}
#pips i.off{background:transparent;box-shadow:0 0 0 2px rgba(244,238,224,.5)}
#msg{position:fixed;left:0;right:0;top:19%;text-align:center;pointer-events:none;padding:0 16px;text-shadow:0 2px 14px rgba(0,0,0,.8)}
#msg b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(30px,10vw,48px);line-height:1.1;color:var(--gold)}
#msg span{display:block;margin-top:6px;font-size:16px;font-weight:700;color:var(--ink)}
#msg.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
#msg.miss b{color:#d9d2c2}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#foot{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
#hint{font-size:13px;font-weight:700;color:var(--cream);text-shadow:0 1px 8px rgba(0,0,0,.9);max-width:70%}
button{font:inherit;font-weight:700;border:0;cursor:pointer}
#re{pointer-events:auto;background:rgba(20,17,15,.7);color:var(--ink);border:1px solid rgba(244,238,224,.35);border-radius:999px;padding:9px 14px;font-size:13px}
.btn{display:block;width:100%;box-sizing:border-box;background:var(--cream);color:#1b1713;border-radius:14px;padding:15px 18px;font-size:17px}
.btn.sub{background:transparent;color:var(--cream);border:1px solid rgba(234,223,196,.4);font-size:15px}
.btn:focus-visible,#re:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(12,10,8,.55)}
#ov[hidden]{display:none}
.sheet{width:100%;max-width:380px;background:var(--panel);border:1px solid rgba(234,223,196,.18);border-radius:20px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet h1{margin:0;font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;letter-spacing:.01em}
.sheet h1 em{font-style:normal;color:var(--red)}
.sheet p{margin:0;font-size:15px;line-height:1.7;color:#d8d0bd}
.sheet ul{margin:0;padding-left:1.2em;font-size:14px;line-height:1.75;color:#d8d0bd}
.note{font-size:13px;color:var(--gold)}
.big{font-family:var(--display);font-size:64px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.rank{font-family:var(--display);font-size:22px}
.row{display:flex;gap:12px;align-items:baseline;justify-content:space-between;font-size:14px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){#msg.pop{animation:none}}
</style>

<video id="cam" playsinline muted autoplay hidden></video>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div><small>ROUND</small><b id="rd">1/5</b></div>
  <div id="pips" aria-label="残りのダーツ"></div>
  <div class="r"><small>SCORE</small><b id="sc">0</b></div>
</div>
<div id="msg" aria-live="polite"></div>
<div id="foot">
  <div id="hint"></div>
  <button id="re" hidden>ボードを置き直す</button>
</div>
<div id="ov"></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var cv=$("c"),ctx=cv.getContext("2d"),video=$("cam");
var rad=function(d){return d*Math.PI/180};
var wrap=function(a){return ((a+180)%360+360)%360-180};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var gauss=function(){return (Math.random()+Math.random()+Math.random()-1.5)*1.4};
var ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
var D=1000, ROUNDS=5, PER=3;

var W,H,F,S,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+"px";cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  F=Math.min(W,H)*1.6; S=F/D;
}
window.addEventListener("resize",resize);resize();

/* ---------- state ---------- */
var stage="intro";      // intro | place | play | end
var useCam=false, sensor=false, gotSensor=false;
var yaw=0,pitch=0,tYaw=0,tPitch=0,bYaw=0,bPitch=0;
var score=0,round=1,left=PER,roundSum=0,stuck=[],flying=null,wobble=0,locked=false,total=[];
var best=0;
try{best=parseInt(localStorage.getItem("ar-darts-best")||"0",10)||0}catch(e){}

/* ---------- audio ---------- */
var ac;
function snd(f,d,type,g){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),G=ac.createGain(),t=ac.currentTime;
    o.type=type||"sine";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*0.4),t+d);
    G.gain.setValueAtTime(g||0.2,t);G.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(G);G.connect(ac.destination);o.start();o.stop(t+d);
  }catch(e){}
}

/* ---------- projection ---------- */
function boardPos(){
  var dy=wrap(bYaw-yaw),dp=pitch-bPitch;
  if(Math.abs(dy)>80||Math.abs(dp)>80)return null;
  return {x:W/2+F*Math.tan(rad(dy)),y:H/2+F*Math.tan(rad(dp))};
}
function aimOffset(){
  return {x:D*Math.tan(rad(wrap(yaw-bYaw))),y:D*Math.tan(rad(pitch-bPitch))};
}

/* ---------- sensors ---------- */
function onOri(e){
  if(e.beta==null)return;
  var h=(typeof e.webkitCompassHeading==="number")?e.webkitCompassHeading:-(e.alpha||0);
  var p=clamp(e.beta-90,-55,55);
  if(!gotSensor){gotSensor=true;tYaw=h;yaw=h;tPitch=p;pitch=p;}
  tYaw=h;tPitch=p;
}
function waitSensor(ms){
  return new Promise(function(res){
    if(gotSensor)return res(true);
    var t0=Date.now();
    (function poll(){
      if(gotSensor)return res(true);
      if(Date.now()-t0>ms)return res(false);
      setTimeout(poll,60);
    })();
  });
}
async function startAR(){
  var s=false,c=false;
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      var r=await DeviceOrientationEvent.requestPermission();
      if(r!=="granted")throw new Error("denied");
    }
    window.addEventListener("deviceorientation",onOri,true);
    s=await waitSensor(1200);
  }catch(e){s=false}
  try{
    var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    video.srcObject=st;video.hidden=false;await video.play();c=true;
  }catch(e){c=false;video.hidden=true}
  useCam=c;sensor=s;
  begin(!c||!s);
}
function startPlain(){useCam=false;sensor=false;begin(false)}

function begin(degraded){
  snd(300,.08,"triangle",.1);
  if(sensor){
    stage="place";
    showOv('<div class="sheet"><h1>ボードを<em>置く</em></h1><p>ダーツボードを置きたい場所にスマホを向けて、ボタンを押してください。</p>'+
      (useCam?'':'<p class="note">カメラが使えないため、部屋の背景の上に表示します。</p>')+
      '<button class="btn" data-a="place">ここに置く</button></div>');
  }else{
    bYaw=yaw=tYaw=0;bPitch=pitch=tPitch=0;
    if(degraded&&stage==="intro"){}
    startGame(true);
  }
}
function placeBoard(){
  bYaw=yaw;bPitch=pitch;
  hideOv();startGame(false);
}

/* ---------- game flow ---------- */
function startGame(look){
  stage="play";score=0;round=1;left=PER;roundSum=0;stuck=[];flying=null;locked=false;total=[];
  hideOv();$("hud").hidden=false;$("re").hidden=!sensor;
  $("hint").textContent=sensor?"スマホを動かして狙い、上へすばやくフリック":"上半分をドラッグで見回し、下半分で上へフリック";
  updHUD();say("","");
}
function updHUD(){
  $("rd").textContent=Math.min(round,ROUNDS)+"/"+ROUNDS;
  $("sc").textContent=score;
  var h="";for(var i=0;i<PER;i++)h+='<i class="'+(i<left?"":"off")+'"></i>';
  $("pips").innerHTML=h;
}
function say(big,sub,miss){
  var m=$("msg");
  m.className="";
  if(!big){m.innerHTML="";return}
  m.innerHTML="<b>"+big+"</b><span>"+(sub||"")+"</span>";
  void m.offsetWidth;
  m.className="pop"+(miss?" miss":"");
}

function judge(x,y){
  var r=Math.hypot(x,y);
  if(r<=6.35)return {pts:50,big:"BULL",sub:"50点",bull:true};
  if(r<=15.9)return {pts:25,big:"OUTER BULL",sub:"25点",bull:true};
  if(r>170)return {pts:0,big:"MISS",sub:"ボードの外",miss:true};
  var a=Math.atan2(x,y)*180/Math.PI;if(a<0)a+=360;
  var n=ORDER[Math.floor(((a+9)%360)/18)];
  if(r>=99&&r<=107)return {pts:n*3,big:"TRIPLE "+n,sub:n*3+"点"};
  if(r>=162)return {pts:n*2,big:"DOUBLE "+n,sub:n*2+"点"};
  return {pts:n,big:String(n),sub:n+"点"};
}

function land(){
  var f=flying;flying=null;
  var j=judge(f.x,f.y);
  stuck.push({x:f.x,y:f.y,c:j.bull?"#ffc83d":(stuck.length%2?"#e2433a":"#3aa8e2")});
  wobble=1;score+=j.pts;roundSum+=j.pts;
  snd(j.miss?90:170,.14,"triangle",.32);
  if(j.bull)snd(1300,.5,"sine",.14);
  say(j.big,j.sub,j.miss);
  updHUD();
  if(left===0){
    setTimeout(function(){
      say("ラウンド合計 "+roundSum,"ROUND "+round+" 終了");
      total.push(roundSum);
    },900);
    setTimeout(endRound,2400);
  }else locked=false;
}
function endRound(){
  stuck=[];roundSum=0;
  if(round>=ROUNDS){finish();return}
  round++;left=PER;locked=false;say("","");updHUD();
}
function finish(){
  stage="end";$("hud").hidden=true;$("re").hidden=true;say("","");
  var isBest=score>best;
  if(isBest){best=score;try{localStorage.setItem("ar-darts-best",String(best))}catch(e){}}
  var rank=score>=600?"マスター":score>=450?"エキスパート":score>=300?"アマチュア":score>=150?"ルーキー":"ビギナー";
  var rows="";for(var i=0;i<total.length;i++)rows+='<div class="row"><span>ROUND '+(i+1)+'</span><b>'+total[i]+'</b></div>';
  showOv('<div class="sheet"><div class="row"><span>TOTAL</span><span>'+(isBest?"ベスト更新!":"ベスト "+best)+'</span></div>'+
    '<div class="big">'+score+'</div><div class="rank">'+rank+'</div>'+rows+
    '<button class="btn" data-a="again">もう一度</button></div>');
}
function showOv(h){var o=$("ov");o.innerHTML=h;o.hidden=false}
function hideOv(){$("ov").hidden=true;$("ov").innerHTML=""}

/* ---------- throwing ---------- */
function throwDart(dx,dy,v){
  var ang=Math.atan2(dx,dy);
  var lat=Math.tan(clamp(ang,-0.5,0.5))*650+gauss()*5;
  var ver=clamp((v-1.5)*170,-230,230)+gauss()*5;
  var a=aimOffset();
  flying={x:a.x+lat,y:a.y+ver,t0:performance.now(),dur:340};
  left--;locked=true;updHUD();
  snd(520,.09,"sine",.08);
}

/* ---------- input ---------- */
var drag=null;
cv.addEventListener("pointerdown",function(e){
  if(stage!=="play"&&stage!=="place")return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  var look=!sensor&&e.clientY<H*0.55;
  drag={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,look:look,s:[{x:e.clientX,y:e.clientY,t:e.timeStamp}]};
  e.preventDefault();
});
cv.addEventListener("pointermove",function(e){
  if(!drag)return;
  drag.s.push({x:e.clientX,y:e.clientY,t:e.timeStamp});
  if(drag.s.length>40)drag.s.shift();
  if(drag.look){
    yaw=wrap(yaw-(e.clientX-drag.lx)*0.12);
    pitch=clamp(pitch+(e.clientY-drag.ly)*0.12,-55,55);
    tYaw=yaw;tPitch=pitch;
  }
  drag.lx=e.clientX;drag.ly=e.clientY;
  e.preventDefault();
});
function up(e){
  if(!drag)return;
  var d=drag;drag=null;
  if(d.look||stage!=="play"||locked||left<=0)return;
  var s=d.s,end=s[s.length-1],i=s.length-1;
  while(i>0&&end.t-s[i-1].t<=90)i--;
  var st=s[i],dt=Math.max(16,end.t-st.t);
  var dx=end.x-st.x,dy=st.y-end.y,dist=Math.hypot(dx,dy);
  if(dy<=20||dist<40){$("hint").textContent="上へ向かって、もっと大きくフリック";return}
  throwDart(dx,dy,dist/dt);
}
cv.addEventListener("pointerup",up);
cv.addEventListener("pointercancel",function(){drag=null});
document.addEventListener("touchmove",function(e){e.preventDefault()},{passive:false});

$("ov").addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.getAttribute("data-a");
  if(a==="ar")startAR();
  else if(a==="plain")startPlain();
  else if(a==="place")placeBoard();
  else if(a==="again"){hideOv();startGame(!sensor)}
});
$("re").addEventListener("click",function(){bYaw=yaw;bPitch=pitch;stuck=[];say("","")});

/* ---------- drawing ---------- */
function drawRoom(bp){
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#2c2723");g.addColorStop(1,"#1b1714");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(255,240,220,.07)";ctx.lineWidth=2;
  for(var k=-12;k<12;k++){
    var d=wrap(k*15-yaw);if(Math.abs(d)>80)continue;
    var x=W/2+F*Math.tan(rad(d));ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  var fy=H/2+F*Math.tan(rad(pitch+32));
  if(fy<H){ctx.fillStyle="#120f0d";ctx.fillRect(0,Math.max(0,fy),W,H);ctx.fillStyle="rgba(255,240,220,.14)";ctx.fillRect(0,fy,W,3)}
  if(bp){
    var gr=ctx.createRadialGradient(bp.x,bp.y,10,bp.x,bp.y,F*0.6);
    gr.addColorStop(0,"rgba(255,225,170,.26)");gr.addColorStop(1,"rgba(255,225,170,0)");
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  }
}
function wedge(cx,cy,r0,r1,a0,a1){
  ctx.beginPath();ctx.arc(cx,cy,r1,a0,a1);ctx.arc(cx,cy,r0,a1,a0,true);ctx.closePath();
}
function drawBoard(cx,cy){
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.55)";ctx.shadowBlur=18*S/0.6;ctx.shadowOffsetY=6;
  ctx.fillStyle="#0b0c0e";ctx.beginPath();ctx.arc(cx,cy,238*S,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.lineWidth=Math.max(.6,.9*S/0.6);ctx.strokeStyle="rgba(200,200,205,.55)";
  for(var i=0;i<20;i++){
    var a0=rad(-90+i*18-9),a1=a0+rad(18),ev=i%2===0;
    var single=ev?"#16181c":"#eadfc4",ring=ev?"#d8382f":"#1f8a4c";
    ctx.fillStyle=single;wedge(cx,cy,15.9*S,99*S,a0,a1);ctx.fill();ctx.stroke();
    wedge(cx,cy,107*S,162*S,a0,a1);ctx.fill();ctx.stroke();
    ctx.fillStyle=ring;wedge(cx,cy,99*S,107*S,a0,a1);ctx.fill();ctx.stroke();
    wedge(cx,cy,162*S,170*S,a0,a1);ctx.fill();ctx.stroke();
  }
  ctx.fillStyle="#1f8a4c";ctx.beginPath();ctx.arc(cx,cy,15.9*S,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle="#d8382f";ctx.beginPath();ctx.arc(cx,cy,6.35*S,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle="#f4eee0";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font="700 "+Math.max(8,20*S)+"px "+getComputedStyle(document.body).fontFamily;
  for(var j=0;j<20;j++){
    var ang=rad(-90+j*18);
    ctx.fillText(String(ORDER[j]),cx+Math.cos(ang)*203*S,cy+Math.sin(ang)*203*S);
  }
}
function drawDart(x,y,k,col,fly){
  var sx=fly?0:5*k,sy=fly?34*k:22*k;
  ctx.save();ctx.lineCap="round";
  ctx.strokeStyle="rgba(0,0,0,.35)";ctx.lineWidth=3.2*k;ctx.beginPath();ctx.moveTo(x+2*k,y+2*k);ctx.lineTo(x+sx+2*k,y+sy+2*k);ctx.stroke();
  ctx.strokeStyle="#c9ccd2";ctx.lineWidth=2.4*k;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+sx*0.45,y+sy*0.45);ctx.stroke();
  ctx.strokeStyle="#7d828c";ctx.lineWidth=5.2*k;ctx.beginPath();ctx.moveTo(x+sx*0.3,y+sy*0.3);ctx.lineTo(x+sx*0.72,y+sy*0.72);ctx.stroke();
  ctx.fillStyle=col;ctx.beginPath();
  ctx.ellipse(x+sx,y+sy,12*k,fly?10*k:8*k,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.ellipse(x+sx-3*k,y+sy-2*k,4*k,3*k,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawCross(){
  var cx=W/2,cy=H/2,pulse=stage==="place"?4*Math.sin(performance.now()/180):0;
  ctx.save();ctx.strokeStyle="rgba(255,200,61,.95)";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,16+pulse,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-26,cy);ctx.lineTo(cx-8,cy);ctx.moveTo(cx+8,cy);ctx.lineTo(cx+26,cy);
  ctx.moveTo(cx,cy-26);ctx.lineTo(cx,cy-8);ctx.moveTo(cx,cy+8);ctx.lineTo(cx,cy+26);ctx.stroke();
  ctx.restore();
}

var last=performance.now();
function frame(now){
  var dt=Math.min(50,now-last);last=now;
  if(sensor&&gotSensor){
    yaw=wrap(yaw+wrap(tYaw-yaw)*0.35);
    pitch+= (tPitch-pitch)*0.35;
  }
  wobble=Math.max(0,wobble-dt/700);
  ctx.clearRect(0,0,W,H);
  var bp=boardPos();
  if(!useCam)drawRoom(bp);
  if(stage!=="intro"&&stage!=="end"||stage==="end"){
    if(bp){
      drawBoard(bp.x,bp.y);
      for(var i=0;i<stuck.length;i++){
        var d=stuck[i],j=Math.sin(now/38+i)*wobble*1.6*S;
        drawDart(bp.x+d.x*S+j,bp.y-d.y*S,S,d.c,false);
      }
    }
    if(flying){
      var t=clamp((now-flying.t0)/flying.dur,0,1);
      if(!bp){land()}
      else{
        var ex=bp.x+flying.x*S,ey=bp.y-flying.y*S,sx=W/2,sy=H*1.0;
        var e=1-Math.pow(1-t,2);
        var px=sx+(ex-sx)*e,py=sy+(ey-sy)*e-Math.sin(Math.PI*t)*H*0.07;
        drawDart(px,py,S*(2.6-1.6*Math.pow(t,0.7)),"#3aa8e2",true);
        if(t>=1)land();
      }
    }
    if(stage==="play"||stage==="place")drawCross();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
